host: angel
description: Home Desktop
import: []
enabled_modules: []
packages: []
exclude: []
additional_packages: []
flatpak_scope: user
auto_prune: false
module_processing: parallel
strict_package_order: false
config_backups:
  enabled: true
  max_backups: 5
system_backups:
  enabled: true
  backup_on_sync: true
  backup_on_update: true
  tool: snapper
  snapper_config: root
  max_backups: 5
services:
  enabled:
  - NetworkManager
  - NetworkManager-dispatcher
  - NetworkManager-wait-online
  - avahi-daemon
  - bluetooth
  - cups
  - docker
  - getty@
  - greetd
  - nvidia-hibernate
  - nvidia-resume
  - nvidia-suspend
  - nvidia-suspend-then-hibernate
  - proton.VPN
  - swayosd-libinput-backend
  - systemd-network-generator
  - systemd-networkd-wait-online
  - udevmon
  disabled: []
enabled_service_profiles: []
update_hooks:
  pre_update: null
  post_update: null
  behavior: ask
  devel: false
default_apps:
  scope: system
  browser: brave-browser
  text_editor: dev.zed.Zed-Preview
  file_manager: kitty-open
  terminal: kitty
  video_player: mpv
  audio_player: mpv
  image_viewer: brave-browser
  pdf_viewer: org.gnome.Evince
  mime_types: {}
editor: null
aur_helper: yay
